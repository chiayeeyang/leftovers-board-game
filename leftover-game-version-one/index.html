<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffd129">
  <meta name="description" content="Your tabletop companion: draw a card, keep track of your money, and roll a die.">
  <title>Game Night — Monopoly-style companion</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffd129'/%3E%3Crect x='6' y='6' width='20' height='20' rx='4' fill='white'/%3E%3Ccircle cx='12' cy='12' r='2'/%3E%3Ccircle cx='20' cy='20' r='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header><a href="./" class="wordmark" aria-label="Leftovers home"><span class="wordmark-art"><img src="assets/board.jpg" alt="Leftovers!"></span></a></header>
    <main>
      <section class="cards" aria-label="Draw a card">
        <div class="section-heading"><h1>A little luck.</h1><span>Pick a card</span></div>
        <div class="card-pair">
          <button class="deck chance" data-deck="chance" aria-label="Draw a Chance card"><span class="deck-name">CHANCE</span><span class="chance-art" aria-hidden="true"><img src="assets/takeaway.png" alt=""></span><span class="deck-action">Draw a card <span>↗</span></span></button>
          <button class="deck community" data-deck="community" aria-label="Draw a Community Chest card"><span class="deck-name">COMMUNITY<br>CHEST</span><span class="chest-art" aria-hidden="true"><img src="assets/board.jpg" alt=""></span><span class="deck-action">Draw a card <span>↗</span></span></button>
        </div>
      </section>
      <section class="money" aria-labelledby="money-heading">
        <div class="money-label"><h2 id="money-heading">YOUR MONEY</h2><button id="reset" class="reset" aria-label="Reset balance to 1500" title="Reset balance to 1500">↺</button></div>
        <div class="calculator">
          <div class="display"><span id="expression">STARTING BALANCE</span><output id="balance" aria-live="polite">1500</output></div>
          <div class="keypad" aria-label="Balance calculator">
            <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="+" class="operator" aria-label="Add">+</button>
            <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="-" class="operator" aria-label="Subtract">−</button>
            <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="*" class="operator" aria-label="Multiply">×</button>
            <button data-key="0">0</button><button data-key="AC" class="clear" aria-label="Clear pending calculation">AC</button><button data-key="/" class="operator" aria-label="Divide">÷</button><button data-key="=" class="equals" aria-label="Equals">=</button>
          </div>
        </div>
        <div class="quick-actions"><button id="pass-go">Pass GO <strong>+200</strong></button><button id="jail">Jail <strong>−50</strong></button></div>
        <p id="calculator-status" class="calculator-status" role="status">Choose + or −, enter an amount, then =.</p>
      </section>
      <section class="dice-section" aria-label="Roll one die">
        <div class="section-heading"><h2>Make your move.</h2><span>One roll. New possibilities.</span></div>
        <div class="dice-row"><div id="die" class="die" role="img" aria-label="Die showing 2"></div><div class="roll-controls"><button id="roll">Roll Dice <span aria-hidden="true">↗</span></button><p id="roll-result" class="sr-only" role="status"></p></div></div>
      </section>
    </main>
  </div>
  <dialog id="card-dialog" aria-labelledby="card-title"><button class="close" id="close-card" aria-label="Close card">×</button><span id="card-type" class="card-type"></span><h2 id="card-title"></h2><p id="card-message"></p><button id="card-done">Back to the game</button><small>Follow the card on your board. Use the calculator for any money changes.</small></dialog>
</body>
</html>
